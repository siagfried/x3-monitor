function renderProviderDetails(root,p,opened){const sources=p?.details||{};function section(key,title,summary){const box=el('details','system-detail',undefined,root);box.dataset.section=key;box.open=opened.has(key);const head=el('summary','',undefined,box);el('span','',title,head);el('span','detail-count',summary,head);return box}function state(box,source){if(!source?.data){el('p','detail-empty',source?.last_attempt?t('暂时无法读取'):t('正在读取'),box);return false}if(!source.fresh)el('p','detail-state detail-warning',t('待刷新 · 上次成功 ')+providerTime(source.last_success),box);return true}function entry(box,meta,text){const row=el('div','detail-entry',undefined,box);el('span','detail-meta',meta,row);if(text)el('div','detail-text',text,row)}
const audit=sources.audit,logs=audit?.data?.items||[],logBox=section('audit',t('操作日志'),audit?.data?logs.length+t(' 条'):'—');if(state(logBox,audit)){if(!logs.length)el('p','detail-empty',t('暂无操作记录'),logBox);for(const item of logs)entry(logBox,providerTime(item.timestamp)+(item.ip&&item.ip!=='0.0.0.0'?' · '+item.ip:''),item.summary||t('管理操作'))}
const backups=sources.backups,snapshots=sources.snapshots,backupCount=(backups?.data?.items?.length||0)+(snapshots?.data?.items?.length||0),backupBox=section('backups',t('备份状态'),backups?.data||snapshots?.data?backupCount+t(' 份'):'—');for(const [name,source]of[[t('自动备份'),backups],[t('快照'),snapshots]]){const items=source?.data?.items||[];el('p','detail-state',name+' · '+(source?.data?items.length+t(' 份'):'—'),backupBox);if(!state(backupBox,source))continue;if(!items.length)el('p','detail-empty',t('暂无')+name,backupBox);for(const item of items)entry(backupBox,providerTime(item.timestamp)+' · '+bytes(item.size_bytes),[item.description,item.os,item.permanent?t('永久保留'):''].filter(Boolean).join(' · '))}
const susp=sources.suspensions,viol=sources.violations,issues=[...(susp?.data?.items||[]),...(viol?.data?.items||[])],known=susp?.fresh&&viol?.fresh&&p?.fresh,abnormal=p?.info?.suspended||p?.info?.policy_violation||issues.length>0,issueBox=section('issues',t('异常状态'),abnormal?t('需关注'):known?t('无异常'):t('待确认'));if(abnormal)issueBox.querySelector('.detail-count').classList.add('detail-warning');if(p?.info?.suspended)el('p','detail-state detail-warning',t('服务器已暂停')+(!susp?.data?.items?.length?t('，接口未提供暂停原因'):''),issueBox);if(p?.info?.policy_violation)el('p','detail-state detail-warning',t('存在待处理违规通知'),issueBox);for(const [name,source]of[[t('暂停记录'),susp],[t('违规通知'),viol]]){el('p','detail-state',name,issueBox);if(!state(issueBox,source))continue;const items=source.data.items||[];if(!items.length)el('p','detail-empty',t('暂无')+name,issueBox);for(const item of items)entry(issueBox,(item.timestamp?providerTime(item.timestamp)+' · ':'')+t('记录 #')+item.record_id+' · '+item.abuse_points+t(' 点'),[item.reason,item.suspend_at?t('计划暂停 ')+providerTime(item.suspend_at):'',item.evidence].filter(Boolean).join('\n'))}if(susp?.data)el('p','detail-state',t('本年暂停 ')+susp.data.suspension_count+t(' 次 · 滥用点数 ')+susp.data.total_abuse_points+' / '+susp.data.max_abuse_points,issueBox)}
$('system-status').onclick=()=>{hideTip();$('system-wrap').classList.toggle('open')};$('system-status').onkeydown=e=>{if(e.key==='Escape'){$('system-wrap').classList.remove('open');e.target.blur()}};document.addEventListener('click',e=>{if(!e.target.closest('.system-wrap'))$('system-wrap').classList.remove('open')});

function updatePanelLink(){$('panel').style.display=config?.panel_url?'':'none';if(!config?.panel_url)return;const u=new URL(config.panel_url);u.searchParams.set('x3_theme',document.documentElement.dataset.theme==='dark'?'dark':'light');$('panel').href=u.href}
function applyTheme(dark){document.documentElement.dataset.theme=dark?'dark':'light';$('theme').innerHTML=svg(dark?'sun':'moon');$('theme').title=dark?t('切换浅色主题'):t('切换深色主题');$('theme').setAttribute('aria-label',$('theme').title);try{localStorage.setItem('x3-theme',dark?'dark':'light')}catch(e){}updatePanelLink();topTips()}
let initialTheme='light';try{initialTheme=localStorage.getItem('x3-theme')||'light'}catch(e){}applyTheme(initialTheme==='dark');$('theme').onclick=()=>applyTheme(document.documentElement.dataset.theme!=='dark');
document.addEventListener('click',e=>{if(!e.target.closest('.card,.bell-menu,.top-actions,.group-toolbar,.group-heading,.group-dialog')){if(selected.size||picker!==null){selectCard(null)}}else if(!e.target.closest('.avatar,.icon-picker')&&picker!==null){picker=null;render()}});
document.querySelector('.top-actions').addEventListener('click',hideTip);
let registration,subscription;async function setupPush(){if(!('serviceWorker'in navigator)||!('PushManager'in window)){$('push-status').textContent=t('此浏览器不支持后台通知');return}registration=await navigator.serviceWorker.register('/sw.js');await navigator.serviceWorker.ready;subscription=await registration.pushManager.getSubscription();if(subscription){await api('/api/push/subscribe',subscription.toJSON());$('notify').classList.add('on');$('push-status').textContent=t('此设备通知已开启')}else $('push-status').textContent=t('开启后，关闭网页也可接收通知')}function decodeKey(s){let raw=atob(s.replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(raw,c=>c.charCodeAt(0))}
$('notify').onclick=()=>$('bell-menu').hidden=!$('bell-menu').hidden;document.addEventListener('click',e=>{if(!e.target.closest('#bell-menu,#notify'))$('bell-menu').hidden=true});$('enable-push').onclick=async()=>{try{if(!registration||!config.push_public_key)throw Error(t('此浏览器暂不支持通知'));const permission=await Notification.requestPermission();if(permission!=='granted')throw Error(t('请在浏览器中允许通知'));subscription=await registration.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:decodeKey(config.push_public_key)});await api('/api/push/subscribe',subscription.toJSON());$('notify').classList.add('on');$('push-status').textContent=t('此设备通知已开启');toast(t('通知已开启'))}catch(e){toast(e.message)}};$('test-push').onclick=async()=>{try{if(!subscription)throw Error(t('请先开启通知'));await api('/api/push/test',{endpoint:subscription.endpoint});toast(t('测试通知已发送'))}catch(e){toast(e.message)}};$('disable-push').onclick=async()=>{try{if(subscription){await api('/api/push/unsubscribe',{endpoint:subscription.endpoint});await subscription.unsubscribe();subscription=null}$('notify').classList.remove('on');$('push-status').textContent=t('此设备通知已关闭');toast(t('通知已关闭'))}catch(e){toast(t('关闭失败，请重试'))}};

function languageChrome(){renderGroupControl();if($('loading-status'))$('loading-status').textContent=t('数据汇总中，请稍后');renderRangeControls();document.documentElement.lang=lang==='en'?'en':'zh-CN';const b=$('language');b.replaceChildren();el('span',lang==='zh'?'current':'','中文',b);el('span','',' / ',b);el('span',lang==='en'?'current':'','EN',b);b.title=b.ariaLabel=lang==='en'?'Switch to Chinese':'Switch to English';for(const [id,key]of[['notify','通知设置'],['system-status','系统状态'],['health','监控服务状态']]){$(id).setAttribute('aria-label',t(key));if(id!=='health'&&id!=='system-status')$(id).title=t(key);else if(id==='system-status')$(id).removeAttribute('title')}for(const [id,key]of[['enable-push','开启通知'],['test-push','发送测试通知'],['disable-push','关闭此设备通知']])$(id).textContent=t(key);$('push-status').textContent=t(subscription?'此设备通知已开启':registration?'开启后，关闭网页也可接收通知':'关注客户端活跃时提醒')}
$('language').onclick=e=>{e.stopPropagation();lang=lang==='zh'?'en':'zh';try{localStorage.setItem('x3-language',lang)}catch(e){}hideTip();languageChrome();applyTheme(document.documentElement.dataset.theme==='dark');if(config){renderServerInfo();render()}const r=cache.get(monthOf(today()));if(r?.health)$('health').title=new Date(r.health.ts*1000).toLocaleString(locale(),{timeZone:tz})+' · '+t(r.health.ok?'采集正常':'采集异常')};languageChrome();

try{const savedLocks=JSON.parse(localStorage.getItem('x3-locked-cards')||'[]');if(Array.isArray(savedLocks))locked=new Set(savedLocks.filter(id=>typeof id==='string'));groupMode=localStorage.getItem('x3-group-mode')==='1';renderGroupControl();const remembered=localStorage.getItem('x3-display-range');if(['year','month','day'].includes(remembered))displayRange=remembered}catch(e){}
(async()=>{try{config=await api('/api/config');prefs=config.preferences;renderServerInfo();updatePanelLink();await getMonth(monthOf(today()));if(displayRange!=='day')await getPeriod(displayRange);render();setupPush().catch(e=>{$('push-status').textContent=t('通知不可用：')+e.message});setInterval(refresh,60000)}catch(e){$('clients').replaceChildren();el('div','error-banner',t('暂时无法连接'),$('clients'))}})();
